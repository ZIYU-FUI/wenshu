name: security-guidance
version: "0.1.0"
description: "当文件写入工具的新内容包含已知危险模式 (pickle.load, yaml.load, eval(, os.system, dangerouslySetInnerHTML, verify=False, ECB, XXE, GitHub Actions 注入, …) 时给结果追加安全警告. 25 条 regex/子串规则, forked 自 Anthropic 的 claude-plugins-official under Apache-2.0. 非阻塞 — 文件正常写入, 警告随下一轮回话回送给模型让它自行修正."
author: "Anthropic (patterns, Apache-2.0) / NousResearch (Wenshu plugin port)"
hooks:
  - transform_tool_result
  - pre_tool_call

name: sms-platform
label: SMS (Twilio)
kind: platform
version: 1.0.0
description: "SMS 网关适配器 (Wenshu Agent, 通过 Twilio). 通过 Twilio REST API + 入站 webhook 收发 SMS, 在电话号码和 Wenshu agent 之间中继短信. Markdown 自动剥离为纯文本."
author: NousResearch
requires_env:
  - name: TWILIO_ACCOUNT_SID
    description: "Twilio Account SID"
    prompt: "Twilio Account SID"
    url: "https://www.twilio.com/"
    password: false
  - name: TWILIO_AUTH_TOKEN
    description: "Twilio Auth Token"
    prompt: "Twilio Auth Token"
    password: true
  - name: TWILIO_PHONE_NUMBER
    description: "Twilio phone number (SMS-capable, E.164 format)"
    prompt: "Twilio phone number"
    password: false
optional_env:
  - name: SMS_ALLOWED_USERS
    description: "Comma-separated phone numbers allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: SMS_HOME_CHANNEL
    description: "Default phone number for cron / notification delivery"
    prompt: "Home number"
    password: false

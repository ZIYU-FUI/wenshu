name: ntfy-platform
label: ntfy
kind: platform
version: 1.0.0
description: "ntfy 推送通知网关适配器 (Wenshu Agent). 通过 HTTP streaming 订阅 ntfy.sh 或任何自托管 ntfy 服务器上的 topic, 通过 HTTP POST 发布回复. 轻量 - 不依赖外部 SDK, 只用 httpx (已经是 Wenshu 依赖). ntfy 没有原生用户身份原语, 适配器把每个 topic 当作一个受信任的单用户通道, 永不从发布方可控字段推导用户身份. 真实信任场景请用私有 topic + 读 token."
author: sprmn24

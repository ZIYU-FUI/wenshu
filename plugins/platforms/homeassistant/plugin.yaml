name: homeassistant-platform
label: Home Assistant
kind: platform
version: 1.0.0
description: "Home Assistant 网关适配器 (Wenshu Agent). 订阅 HA 的 WebSocket 事件总线, 把状态变更事件 (含每个实体的冷却时间和 domain/entity 过滤) 转发给 agent. 出站消息通过 REST API 以 HA 持久化通知发送. 也支持通过 ``notify.notify`` 服务进行进程外的定时任务投递."
author: NousResearch
requires_env:
  - name: HASS_TOKEN
    description: "Home Assistant Long-Lived Access Token"
    prompt: "Home Assistant Long-Lived Access Token"
    password: true
optional_env:
  - name: HASS_URL
    description: "Home Assistant base URL (default: http://homeassistant.local:8123)"
    prompt: "Home Assistant URL"
    password: false

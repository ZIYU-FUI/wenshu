name: photon-platform
label: iMessage via Photon
kind: platform
version: 0.3.0
description: "Photon Spectrum 网关适配器 (Wenshu Agent). 通过 Photon 托管的 Spectrum 平台接入 iMessage (以及其他 Spectrum 接口). 两个方向都通过 spectrum-ts SDK 的长寿 gRPC 流, 由一个小型受监督 Node sidecar 承载 - 入站消息落在 SDK 的 app.messages 流上 (无 webhook, 无公网 URL, 无签名密钥), 出站消息也走同一个 sidecar. 插件自带 wenshu photon CLI 用于一次性设备登录 + 项目 + 用户配置. 运行期凭据写到 ~/.wenshu-hermes/.env (PHOTON_PROJECT_ID = Spectrum 项目 id, PHOTON_PROJECT_SECRET), 管理元数据 (设备 token, dashboard 项目 id) 在 ~/.wenshu-hermes/auth.json. Photon 的免费共享线路模式让用户无需付费即可上手."
author: NousResearch

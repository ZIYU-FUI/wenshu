name: raft-platform
label: Raft
kind: platform
version: 1.0.0
description: "Raft 网关适配器 (Wenshu Agent). 通过本地 wake-channel bridge 把 Raft workspace 作为外部 agent 接入. 适配器启动一个 loopback HTTP 端点接收 bridge 发来的无内容唤醒提示, 然后把它注入 Wenshu gateway 会话流水线. Agent 通过 Raft CLI 收发消息 — 适配器从不接触消息体或投递游标."
author: botiverse
requires_env:
  - name: RAFT_PROFILE
    description: "Raft agent profile slug — auto-enables the adapter when set"
    prompt: "Raft agent profile"
    password: false
    category: setting

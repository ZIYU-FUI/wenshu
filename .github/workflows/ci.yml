name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/desktop && pnpm run lint

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/desktop && pnpm run typecheck

  test:
    name: Vitest (unit + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/desktop && pnpm run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-logs
          path: apps/desktop/vitest-logs/

  rust-check:
    name: Rust Check (bootstrap-installer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77
      - run: pnpm install --frozen-lockfile
      - run: cd apps/bootstrap-installer && pnpm install
      - run: cd apps/bootstrap-installer/src-tauri && cargo check

  installer-build:
    name: Installer Build (dmg)
    runs-on: macos-latest
    needs: [lint, typecheck, rust-check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77
      - run: pnpm install --frozen-lockfile
      - run: cd apps/bootstrap-installer && pnpm install
      - run: cd apps/bootstrap-installer && CSC_IDENTITY_AUTO_DISCOVERY=false pnpm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: wenshu-setup-dmg
          path: apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/

  desktop-build:
    name: Desktop Build (mac .app + dmg)
    runs-on: macos-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/desktop && CSC_IDENTITY_AUTO_DISCOVERY=false pnpm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: wenshu-desktop-mac
          path: apps/desktop/release/

  install-sh-manifest:
    name: Installer Manifest Smoke Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/install.sh
      - run: bash scripts/install.sh -Manifest 2>&1 | head -50
      - run: bash scripts/install.sh -Manifest 2>&1 | jq '.stages | length'

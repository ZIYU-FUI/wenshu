name: wenshu CI

on:
  push:
    branches: [main, wt/**]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        # `shell: bash` (EXPLICIT) = `bash --noprofile --norc -eo pipefail {0}`.
        # The UNSPECIFIED default = `bash -e {0}`, which has `-e` but NOT
        # `-o pipefail`, so a command piped into `tee` reports TEE's exit
        # code and the step passes even when the command failed.
        # (GitHub's own docs, "supported shells": the unspecified row runs a
        # DIFFERENT command from the `bash` row.)
        #
        # Measured 2026-11-02 on this repository's own `swift test` log: the
        # three "Test run with ..." summaries belong to the three SWIFT TESTING
        # targets (= WenshuDataTests, WenshuAppTests and WenshuAgentTests), and
        # the WenshuAppTests one reported "3219 tests in 513 suites FAILED with
        # 11 issues". The summaries are printed in a fixed order and the failing
        # one is NOT the last, so a check that reads only the LAST "Test run"
        # line read a passing target's summary, and a tree with 11 failing
        # assertions reported green.
        #
        # The XCTest bundles print NO "Test run with" line at all: XCTest
        # reports its own verdict as "Executed N tests, with M failures", and
        # every one of those lines sits BEFORE the first "Test run with" line.
        # So the XCTest channel is invisible to a scan of the summaries, and the
        # test step below reads BOTH.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for tag detection

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Swift version
        run: swift --version

      - name: Swift build
        run: swift build 2>&1 | tee /tmp/wenshu-build.log

      - name: Swift test
        # Capture test count for PR comment + tracking.
        # Per v0.28 ticket 028-011 §"Acceptance criteria" #4 the
        # DragRegressionTests suite (= 8 tests) is part of the
        # full `swift test` invocation; no separate filter is
        # needed because the suite runs in the same target.
        # Spec referenced '.github/workflows/test.yml' = our
        # actual filename is 'ci.yml' (= same job, same trigger,
        # same macos-14 runner).
        run: |
          # `errexit` would abort the step AT the `| tee` line, one line
          # before the log could be read, so the status is captured with
          # errexit off and the verdict is decided below (= the step still
          # names the target that failed).
          set +e
          swift test 2>&1 | tee /tmp/wenshu-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          # Every SWIFT TESTING target prints its own "Test run with ..."
          # summary, and this package has three (= WenshuDataTests,
          # WenshuAppTests and WenshuAgentTests). They are printed in a fixed
          # order, and the one that fails is NOT the last, so a check that
          # reads only the LAST line reads a PASSING target's summary. Every
          # summary is read, and one that says "failed" is a failure.
          TEST_LINES=$(grep "Test run with" /tmp/wenshu-test.log || true)
          if [ -z "$TEST_LINES" ]; then
            echo "No 'Test run with' summary in the log (= the test run did not complete)"
            exit 1
          fi
          # The XCTest bundles print NO "Test run with" line: XCTest reports
          # its own verdict as "Executed N tests, with M failures", and every
          # one of those lines sits BEFORE the first summary. So a failing
          # XCTest class is invisible to the grep above, and the step would go
          # red naming no target. Read the XCTest verdict as well.
          XC_FAILURES=$(grep -E "Executed [0-9]+ tests, with [1-9][0-9]* failure" /tmp/wenshu-test.log || true)
          # swift-testing names each failing target and its framework.
          TARGET_NOTE=$(grep -A5 "Some test targets reported failures" /tmp/wenshu-test.log || true)
          {
            echo "## $TEST_LINES"
            if [ -n "$XC_FAILURES" ]; then echo "$XC_FAILURES"; fi
            if [ -n "$TARGET_NOTE" ]; then echo "$TARGET_NOTE"; fi
          } >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_STATUS" -ne 0 ] || echo "$TEST_LINES" | grep -q "failed"; then
            echo "Tests failed (swift test exit $TEST_STATUS) — see log"
            echo "$TEST_LINES" | grep "failed" || true
            if [ -n "$XC_FAILURES" ]; then echo "$XC_FAILURES"; fi
            if [ -n "$TARGET_NOTE" ]; then echo "$TARGET_NOTE"; fi
            exit 1
          fi
          echo "All test targets passed"

      - name: Pollution check
        run: |
          # The forbidden vocabulary must not reach the committed artifacts.
          #
          # This step used to run `git log --all -p | grep <vocabulary>`, which
          # counts 4788 lines on this repository's own history: `git log -p`
          # prints DELETED lines, so the step asked "did it ever exist" while
          # claiming to ask "does it exist now", and it was red on main and
          # could never be green.
          #
          # It now measures the CHANGE: the lines this change adds are
          # scanned, and the vocabulary and the path allowlist come from
          # commit_filter.py (= the repository's own source for both, = this
          # file carries no second copy of either).
          #
          # The base ref is the one that resolves in every trigger: a pull
          # request has origin/main, a push to a worktree branch has
          # origin/main, and a push to main has the sha the event carries as
          # `before` (origin/main is HEAD there, so a diff against it would
          # be empty).
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          python3 Tools/wenshu-devtool/ci_change_gate.py --base "$BASE" --check pollution

      # Source-code lint gate (batch 1 issue 08)
      # Runs SwiftLint + SwiftFormat lint on every push + PR.
      # Both tools are pinned via the Brewfile (= batch 1 issue 01) but
      # CI uses Homebrew install for cross-machine reproducibility.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: SwiftLint lint
        # Per AGENTS.md Section 11 + Section 12 rules: English-only + 12 forbidden
        # vocab + Apple HIG + identifiers = enforced by CI (= not by per-commit
        # code review alone). Run WITHOUT --strict (= report-only mode).
        # Rationale: default rules trigger ~100+ pre-existing violations on the
        # current codebase (= trailing comma / whitespace / colon spacing),
        # which are out of scope for batch 1 (= per Q124 1-ticket-1-commit,
        # 'lint cleanup sweep' is a separate future ticket).
        # The custom xianxia_forbidden_vocab rule has severity: error so
        # swiftlint exits non-zero on any leak => the CI step hard-fails
        # (= enforces the forbidden-vocab invariant automatically, no human
        # review needed for this specific check).
        run: |
          # `errexit` would abort the step AT the `| tee` line, one line
          # before `exit_status` is read, so the status is captured with
          # errexit off. Without this the report-only escape hatch below
          # (= a non-zero exit with 0 error-severity violations) is
          # unreachable, and a leak goes red with no list of the
          # offending files.
          set +e
          swiftlint lint --quiet 2>&1 | tee /tmp/wenshu-swiftlint.log
          exit_status=${PIPESTATUS[0]}
          set -e
          if [ "$exit_status" -ne 0 ]; then
            # Distinguish: was it a real error (= xianxia leak or other error
            # severity violation) or just info/warning volume from default rules?
            error_count=$(grep -cE '^/.*: error:' /tmp/wenshu-swiftlint.log || true)
            if [ "$error_count" -gt 0 ]; then
              echo "SwiftLint hard-failed: $error_count error-severity violations (= includes any xianxia_forbidden_vocab leak)"
              grep -E '^/.*: error:' /tmp/wenshu-swiftlint.log | head -50
              exit 1
            fi
            echo "SwiftLint: $exit_status non-zero exit code but 0 error-severity violations (= all warnings/info; future sweep ticket will address)"
            exit 0
          fi
          echo "SwiftLint clean (= 0 error-severity violations)"

      - name: SwiftFormat lint
        # Lint-only (= no auto-fix). The gate lints with SwiftFormat's DEFAULT
        # rules: the repo's .swift-format is NOT read (= the two reasons are
        # below). CI verifies the lines this change adds are the lines
        # SwiftFormat is happy with.
        #
        # The step checks the lines THIS CHANGE adds, not the whole touched
        # file and not the tree. The tree carries 1033 files that were never
        # formatted (504 of 543 under Sources/, and 529 of 537 under Tests/,
        # and 504 + 529 = 1033), so a whole-file check was red before any
        # change and could never be green = a step that reports the history
        # instead of the change.
        #
        # SwiftFormat reports every violation in a file; the gate keeps the
        # ones that fall on a line the change added, because the tree's own
        # drift belongs to the tree (= its own card, not every push).
        #
        # THE GATE LINTS WITH SWIFTFORMAT'S DEFAULT RULES, ON PURPOSE, AND
        # THE REASON IS TWO SEPARATE THINGS:
        #
        # 1. SwiftFormat discovers its configuration under the name
        #    `.swiftformat` (no dash). The repository's file is named
        #    `.swift-format` (with a dash), so SwiftFormat NEVER reads it:
        #    measured 2026-11-02, a lint run in this repository does not
        #    print "Reading config file" at all. The two names are not
        #    interchangeable.
        # 2. Even under the name SwiftFormat does read, the file's CONTENT
        #    would be rejected: it is in the `swift-format` JSON dialect,
        #    and SwiftFormat 0.62.1 answers "error: Unknown option '{' in
        #    configuration file", exits 70, and reports NO violation. A
        #    rejected configuration makes SwiftFormat report nothing, so
        #    passing it would make this gate silently green (= the very
        #    failure this gate exists to remove).
        #
        # So the gate lints with SwiftFormat's DEFAULT rules, and the
        # configuration file's own repair (= its name AND its dialect) is
        # its own card. The tool's docstring carries the full measurement:
        # Tools/wenshu-devtool/ci_change_gate.py, `swiftformat_args`.
        #
        # A SwiftFormat run that could not COMPLETE (a missing file, a
        # rejected config, a syntax error) exits 70 and reports nothing, so
        # the gate treats that as a FAILURE, never as a clean file.
        #
        # The base ref is the one that resolves in every trigger: a
        # pull request has origin/main, a push to a worktree branch has
        # origin/main, and a push to main has the sha the event carries
        # as `before` (origin/main is HEAD there, so a diff against it
        # would be empty).
        #
        # COMMIT-MESSAGE BODIES are not read by any CI step: the gate scans
        # the diff's ADDED LINES only, and `lint-commits` reads the SUBJECT
        # (`--format=%s`) of the last 10 commits. A message body carrying
        # forbidden vocabulary is still blocked at commit time by the local
        # `commit_filter.py --hook=commit-msg` hook, which is where that
        # coverage lives.
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          python3 Tools/wenshu-devtool/ci_change_gate.py --base "$BASE" --check formatting

      - name: Verify pre-commit hook installed
        run: |
          if [ ! -x .git/hooks/pre-commit ]; then
            echo "WARNING: pre-commit hook not installed. Run Tools/wenshu-devtool/install_hook.sh"
          else
            echo "Pre-commit hook installed"
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenshu-test-log
          path: /tmp/wenshu-test.log
          retention-days: 7


  # The client is a SECOND product in this repository (the native iOS and
  # iPadOS app, at Mobile/), so it needs its own job: the desktop job proves
  # the desktop app, and this one proves the client. The step summary says
  # which product went green, so a reader never has to guess.
  client-build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        # The same reason as the desktop job's: the unspecified default shell
        # has no `-o pipefail`, so a command piped into `tee` reports tee's
        # exit code and the step passes even when the command failed.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Swift version
        run: swift --version

      - name: Swift build (the client)
        # The client is its own SwiftPM package, so it builds from its own
        # directory (= SwiftPM uses the NEAREST manifest).
        run: cd Mobile && swift build 2>&1 | tee /tmp/wenshu-mobile-build.log

      - name: iOS build (simulator)
        # The product target is iOS and iPadOS, so the simulator build is the
        # one that proves the product compiles.
        #
        # OTHER_LDFLAGS stamps the SDK the build compiled against into the
        # product's LC_BUILD_VERSION. Without it SwiftPM derives the stamp
        # from Package.swift's platform declaration and the binary carries
        # sdk 18.0, which the newest systems draw as a legacy binary and
        # scale into a phone-sized window. The minimum OS stays 18.0, so the
        # deployment floor of ADR-0002 does not move.
        #
        # The flag is passed in the -Xlinker form on purpose: the comma
        # form (-Wl,-platform_version,ios-simulator,18.0,27.1) is split
        # by xcodebuild and the link dies with "unknown argument".
        run: |
          cd Mobile
          xcodebuild -scheme WenshuMobile-Package \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/wenshu-mobile-dd \
            'OTHER_LDFLAGS=$(inherited) -Xlinker -platform_version -Xlinker ios-simulator -Xlinker 18.0 -Xlinker 27.1' \
            build 2>&1 | tee /tmp/wenshu-mobile-ios.log
          grep -q "BUILD SUCCEEDED" /tmp/wenshu-mobile-ios.log

      - name: Swift test (the client)
        # The deployment floor test reads the LC_BUILD_VERSION of the
        # product the iOS build above produced, so that build comes first.
        run: |
          cd Mobile
          # `errexit` would abort the step AT the `| tee` line, one line
          # before the log could be read, so the status is captured with
          # errexit off and the verdict is decided below.
          set +e
          swift test 2>&1 | tee /tmp/wenshu-mobile-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          # Every target's summary is read (= the same reason as the desktop
          # job's step: the target that fails is not the last one).
          TEST_LINES=$(grep "Test run with" /tmp/wenshu-mobile-test.log || true)
          if [ -z "$TEST_LINES" ]; then
            echo "No 'Test run with' summary in the log (= the test run did not complete)"
            exit 1
          fi
          {
            echo "## client: $TEST_LINES"
          } >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_STATUS" -ne 0 ] || echo "$TEST_LINES" | grep -q "failed"; then
            echo "Client tests failed (swift test exit $TEST_STATUS) — see log"
            echo "$TEST_LINES" | grep "failed" || true
            exit 1
          fi
          echo "All client test targets passed"

      - name: Design sweep (the client)
        # The sweep's own default file list is `git diff main...HEAD`, and
        # that is EMPTY in both shapes this workflow runs in (a pull-request
        # checkout has no local main, and a push to main has main...HEAD
        # empty by definition) = the step would pass over a tree that
        # contains violations. So the file list is given EXPLICITLY, and the
        # step can fail.
        run: |
          bash Tools/wenshu-devtool/design-sweep.sh \
            $(git ls-files 'Mobile/Sources/**.swift' 'Mobile/Tests/**.swift')

      - name: Agents gate (the client's SSOT)
        # The client's SSOT is its own file (= the root one is the
        # desktop's), so the gate reads that one.
        #
        # The gate's cap is the cap the Hermes config pins, and a runner
        # has no Hermes config (= no pin), so the gate would fall back to
        # the loader's floor (= 20,000 chars) and the file would sit one
        # edit away from a false red. The pin is written here, so the CI
        # checks the file against the SAME cap the developers' loader
        # uses (= 500,000 chars = 0.5 MB).
        run: |
          mkdir -p "$HOME/.hermes"
          printf 'context_file_max_chars: 500000\n' > "$HOME/.hermes/config.yaml"
          python3 Tools/wenshu-devtool/agents_gate.py --file Mobile/AGENTS.md
  # Lint commit messages for conventional commits + English-only
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Check commit message format
        run: |
          # Verify each commit message is English + follows conventional format
          git log --format=%s -10 | while read SUBJECT; do
            # Skip merge commits
            if echo "$SUBJECT" | grep -qE "^Merge"; then
              continue
            fi
            # Verify conventional commit prefix
            # The scope is OPTIONAL and free-form: the repo's own
            # commits use many of them (= "(gate)", "(close)",
            # "(editor)", ... = 97 distinct scopes over main's history),
            # and the rule is "a conventional prefix", not "the scope
            # must be (wenshu)". That regex demanded one exact scope.
            # Measured at tree 50f325e848, with each rule read out of
            # the workflow file it lives in (= 57be84050a for the old
            # one, the tip for this one), over the 5,602 commits
            # 57be84050a..50f325e848:
            #   the OLD rule rejected 1,215 subjects, of which 650 carry
            #   a scope (= 585 with a scope other than (wenshu), 65 with
            #   (wenshu) exactly) and 565 carry no scope at all;
            #   the rule above rejects 656, of which 91 carry a scope
            #   (= 88 of them have a scope this job's charset accepts
            #   and are rejected for their type, and 3 have a space in
            #   the scope) and 565 carry no scope at all.
            # A scope is "^\w+\([^)]*\):", ANCHORED at the subject's
            # head (= the anchor matters: an unanchored grep also counts
            # a scope-shaped token inside a quoted revert title).
            # So the fix stopped the scope's content from being the
            # reason a subject was refused, and the scope's existence
            # is now accepted.
            # The job reads only the last 10 subjects, so it was red on
            # main in WINDOWS, not in every window (= a window of ten
            # subjects that all carry (wenshu) passes), and it refused
            # for three reasons: a scope other than (wenshu) (= what
            # this fix addresses), no conventional prefix at all, and a
            # type outside the nine conventional ones (= feat, fix,
            # docs, test, refactor, chore, perf, build, ci; the types
            # outside that set the repo writes with a scope are merge,
            # style, ref, i18n, tool, spec, debug, revert, cleanup and
            # review). Only the first is a scope question.
            # No count over the whole history is quoted here: every one
            # of them is over the commits that exist at the tree, so it
            # moves as the tree moves.
            if ! echo "$SUBJECT" | grep -qE "^(feat|fix|docs|test|refactor|chore|perf|build|ci)(\([a-zA-Z0-9._/-]+\))?:"; then
              echo "Bad commit subject: $SUBJECT"
              exit 1
            fi
            # Verify no CJK in subject
            if echo "$SUBJECT" | grep -qE "[一-鿿]"; then
              echo "CJK in commit subject: $SUBJECT"
              exit 1
            fi
          done
          echo "Commit message format check passed"
